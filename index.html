<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="The original Weekly Mileage Planner and Track Split Calculator, together in two tabs." />
    <title>Running Utilities</title>
  </head>
  <body>
    <div class="tool-tabs" role="tablist" aria-label="Running tools">
      <button id="mileage-tab" type="button" role="tab" aria-controls="weekly-mileage" aria-selected="true" data-tool="weekly-mileage">Weekly Mileage Planner</button>
      <button id="splits-tab" type="button" role="tab" aria-controls="track-splits" aria-selected="false" tabindex="-1" data-tool="track-splits">Track Split Calculator</button>
    </div>
    <main>
      <section id="weekly-mileage" role="tabpanel" aria-labelledby="mileage-tab">
        <iframe src="%BASE_URL%weekly-mileage/index.html" title="Weekly Mileage Planner"></iframe>
      </section>
      <section id="track-splits" role="tabpanel" aria-labelledby="splits-tab" hidden>
        <iframe src="%BASE_URL%track-splits/index.html" title="Track Split Calculator"></iframe>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
